<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0a0f" />
    <meta
      name="description"
      content="Portfólio de Patrick Lemes. Desenvolvimento, software livre e experimentos com código."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="icon" href="images/icon.jpg" type="image/jpeg" />
    <title>Patrick Lemes — Portfólio</title>
  </head>
  <body>
    <a class="skip-link" href="#app">Pular para o conteúdo</a>
    <header class="mobile-header">
      <a class="wordmark" href="#/homepol" aria-label="Patrick Lemes, início"
        ><span class="wordmark-full">Patrick Lemes</span
        ><span class="wordmark-short" aria-hidden="true">PL</span></a
      >
      <button
        class="icon-button"
        id="menu-toggle"
        aria-label="Abrir menu"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <i class="bi bi-list" aria-hidden="true"></i>
      </button>
    </header>
    <button
      class="menu-backdrop"
      aria-label="Fechar menu"
      tabindex="-1"
      hidden
    ></button>
    <aside class="sidebar" id="sidebar" aria-label="Navegação principal">
      <a class="wordmark" href="#/homepol" aria-label="Patrick Lemes, início"
        ><span class="wordmark-full">Patrick Lemes</span
        ><span class="wordmark-short" aria-hidden="true">PL</span></a
      >
      <div class="sidebar-caption mono">// NAVEGAÇÃO</div>
      <nav aria-label="Páginas do portfólio">
        <ul>
          <li>
            <a href="#/homepol" data-route="/homepol" title="Início"
              ><i class="bi bi-house-door" aria-hidden="true"></i
              ><span>Início</span><small>01</small></a
            >
          </li>
          <li>
            <a href="#/sobre" data-route="/sobre" title="Sobre mim"
              ><i class="bi bi-person" aria-hidden="true"></i
              ><span>Sobre mim</span><small>02</small></a
            >
          </li>
          <li>
            <a href="#/projetos" data-route="/projetos" title="Projetos"
              ><i class="bi bi-code-square" aria-hidden="true"></i
              ><span>Projetos</span><small>03</small></a
            >
          </li>
          <li>
            <a href="#/galeria" data-route="/galeria" title="Galeria"
              ><i class="bi bi-camera" aria-hidden="true"></i
              ><span>Galeria</span><small>04</small></a
            >
          </li>
        </ul>
        <div class="sidebar-caption mono">// LABORATÓRIO</div>
        <ul>
          <li>
            <a
              href="#/retas-e-poligonos"
              data-route="/retas-e-poligonos"
              title="Retas e polígonos"
              ><i class="bi bi-bounding-box" aria-hidden="true"></i
              ><span>Retas e polígonos</span
              ><i class="bi bi-arrow-up-right nav-arrow" aria-hidden="true"></i
            ></a>
          </li>
          <li>
            <a
              href="#/visualizator"
              data-route="/visualizator"
              title="Visualizator"
              ><i class="bi bi-grid" aria-hidden="true"></i
              ><span>Visualizator</span
              ><i class="bi bi-arrow-up-right nav-arrow" aria-hidden="true"></i
            ></a>
          </li>
          <li>
            <a href="#/minicoin" data-route="/minicoin" title="MiniCoin"
              ><i class="bi bi-currency-bitcoin" aria-hidden="true"></i
              ><span>MiniCoin</span
              ><i class="bi bi-arrow-up-right nav-arrow" aria-hidden="true"></i
            ></a>
          </li>
        </ul>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-socials">
          <a
            href="https://github.com/papatrock"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub (nova aba)"
            ><i class="bi bi-github" aria-hidden="true"></i></a
          ><a
            href="https://www.linkedin.com/in/patrick-lemes-67a989223/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn (nova aba)"
            ><i class="bi bi-linkedin" aria-hidden="true"></i></a
          ><a href="mailto:pol21@inf.ufpr.br" aria-label="Enviar email"
            ><i class="bi bi-envelope" aria-hidden="true"></i></a
          ><button
            class="icon-button collapse-button"
            data-resize-btn
            aria-label="Recolher navegação"
            aria-expanded="true"
          >
            <i class="bi bi-layout-sidebar-inset" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="breadcrumb-path mono">
          <span>~/portfólio</span><span>/</span
          ><span id="current-page">início</span><span class="cursor">_</span>
        </div>
        <button
          class="motion-toggle mono"
          id="motion-toggle"
          aria-pressed="false"
          title="Pausar animações"
        >
          <span class="status-dot"></span
          ><span id="motion-label">animações on</span>
        </button>
      </header>
      <main
        class="main"
        id="app"
        tabindex="-1"
        aria-label="Conteúdo da página"
      ></main>
      <footer class="site-footer">
        <img
          class="footer-mascot footer-mascot-left"
          src="images/footer/blob.avif"
          alt=""
          width="112"
          height="112"
        />
        <div class="footer-content">
          <div class="footer-socials">
            <a
              href="https://github.com/papatrock"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="GitHub (nova aba)"
              ><i class="bi bi-github" aria-hidden="true"></i></a
            ><a
              href="https://www.linkedin.com/in/patrick-lemes-67a989223/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="LinkedIn (nova aba)"
              ><i class="bi bi-linkedin" aria-hidden="true"></i
            ></a>
          </div>
          <a href="mailto:pol21@inf.ufpr.br">pol21@inf.ufpr.br</a>
          <a
            class="footer-source mono"
            href="https://github.com/papatrock/web-t1"
            target="_blank"
            rel="noopener noreferrer"
            >Código-fonte ↗</a
          >
          <span class="footer-copyright mono"
            >© <span id="year">2026</span> Patrick Lemes</span
          >
        </div>
        <img
          class="footer-mascot footer-mascot-right"
          src="images/footer/anoing-dog-head.png"
          alt=""
          width="80"
          height="140"
        />
      </footer>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/home/script.js"></script>
    <script src="js/galeria/galeria.js"></script>
    <script src="js/router.js"></script>
  </body>
</html>
